name: JANSEVA CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Lint, Test & Seed Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx flake8

      - name: Lint Backend Code
        working-directory: ./backend
        run: |
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Seed Database Validation
        working-directory: ./backend
        run: |
          python seed_data.py

      - name: Run Endpoint Tests
        working-directory: ./backend
        run: |
          python direct_test.py

  frontend-build:
    name: Frontend Lint, PWA Validation & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Production Assets
        working-directory: ./frontend
        run: npm run build

      - name: Verify PWA Manifest & Service Worker Assets
        working-directory: ./frontend
        run: |
          test -f dist/manifest.webmanifest || exit 1
          test -f dist/sw.js || exit 1
          test -f dist/offline.html || exit 1
          echo "PWA Assets and Production Bundles Successfully Verified!"

  deploy-preview:
    name: Deployment Preview & Health Check Hook
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Trigger
        run: |
          echo "Automated Webhook triggers configured for Vercel (Frontend) and Render (Backend)."
          echo "Rollback point tagged: release-${{ github.sha }}"
