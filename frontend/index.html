<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#6739E8" />
    
    <!-- PWA & Mobile Meta Tags -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JANSEVA" />
    <meta name="application-name" content="JANSEVA" />
    <meta name="format-detection" content="telephone=no" />
    
    <meta name="description" content="JANSEVA – Enterprise Smart Municipal Governance, Citizen Engagement, AI Photo Verification, Government Schemes & Ward Development Platform." />
    <title>JANSEVA – Smart Civic Solutions</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <!-- Google Fonts: Plus Jakarta Sans / Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      /* Pre-hydration Instant Loading Screen */
      #app-loader {
        position: fixed;
        inset: 0;
        background: #F7F7FC;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        transition: opacity 0.3s ease-out;
      }
      .loader-pulse {
        width: 64px;
        height: 64px;
        background: #6739E8;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px -3px rgba(103, 57, 232, 0.4);
        animation: pulseScale 1.6s ease-in-out infinite;
      }
      @keyframes pulseScale {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      .loader-text {
        margin-top: 16px;
        font-size: 16px;
        font-weight: 700;
        color: #202033;
        letter-spacing: -0.02em;
      }
      .loader-sub {
        margin-top: 4px;
        font-size: 12px;
        color: #77758C;
        font-weight: 500;
      }
    </style>
  </head>
  <body class="bg-[#F7F7FC] text-[#202033] antialiased selection:bg-[#6739E8] selection:text-white min-h-screen">
    <!-- Immediate Pre-Hydration Splash -->
    <div id="app-loader">
      <div class="loader-pulse">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
          <path d="M2 17l10 5 10-5"></path>
          <path d="M2 12l10 5 10-5"></path>
        </svg>
      </div>
      <div class="loader-text">JANSEVA</div>
      <div class="loader-sub">Smart Civic Solutions</div>
    </div>

    <div id="root"></div>

    <script>
      // Remove loader when React mounts
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const loader = document.getElementById('app-loader');
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 300);
          }
        }, 150);
      });

      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('JANSEVA ServiceWorker registered with scope:', registration.scope);
              
              // Detect updates
              registration.onupdatefound = () => {
                const installingWorker = registration.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      window.dispatchEvent(new CustomEvent('janseva-app-update-available'));
                    }
                  };
                }
              };
            })
            .catch((error) => {
              console.log('JANSEVA ServiceWorker registration failed:', error);
            });
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
